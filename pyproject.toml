[project]
name = "atividade-1-regressao"
version = "0.1.0"
description = "ACH2036 Activity 1: simple linear regression, residual analysis and scale transformations"
requires-python = ">=3.12"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atividade_1_regressao"]
